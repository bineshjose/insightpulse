<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <!-- Subtle geometric pattern: pulse grid on navy gradient at low opacity -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003865"/>
      <stop offset="100%" stop-color="#004A7C"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="pulse" width="240" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 L60 60 L84 28 L120 92 L144 44 L164 60 L240 60"
            fill="none" stroke="#00A4E4" stroke-opacity="0.06" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#pulse)"/>
</svg>
