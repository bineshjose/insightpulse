# FastAPI + LangGraph pipeline deployment.
# Production patterns applied: pinned image (CI substitutes the tag),
# resource requests/limits, all three probe types, restricted security
# context (non-root, read-only root FS, no privilege escalation), and
# secrets mounted through the Key Vault CSI volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightpulse-app
  namespace: insightpulse
  labels:
    app.kubernetes.io/name: insightpulse-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: insightpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insightpulse-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insightpulse-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: insightpulse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload: insightpulse
      containers:
        - name: app
          # CI replaces IMAGE_TAG with the release semver (cd.yml).
          image: acrinsightpulseprod.azurecr.io/insightpulse-app:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: insightpulse-config
            - secretRef:
                name: insightpulse-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            # Model/library imports make cold start slow; give it 2 minutes
            # before liveness takes over.
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /app/storage
            - name: keyvault-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        # Writable scratch space (root FS is read-only).
        - name: tmp
          emptyDir: {}
        - name: storage
          emptyDir: {}
        # Mounting this volume is what triggers the CSI driver to sync
        # Key Vault into the insightpulse-secrets Kubernetes Secret.
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: insightpulse-keyvault
      terminationGracePeriodSeconds: 60
