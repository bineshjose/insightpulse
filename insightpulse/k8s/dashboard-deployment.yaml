# Streamlit dashboard deployment. Same security posture as the API;
# a single replica is sufficient (session state is per-browser-tab and
# the dashboard is read-mostly against the API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightpulse-dashboard
  namespace: insightpulse
  labels:
    app.kubernetes.io/name: insightpulse-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: insightpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insightpulse-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insightpulse-dashboard
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: insightpulse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload: insightpulse
      containers:
        - name: dashboard
          # CI replaces IMAGE_TAG with the release semver (cd.yml).
          image: acrinsightpulseprod.azurecr.io/insightpulse-dashboard:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: API_URL
              value: "http://insightpulse-app:8000"
          envFrom:
            - configMapRef:
                name: insightpulse-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: streamlit-home
              mountPath: /app/.streamlit
      volumes:
        - name: tmp
          emptyDir: {}
        # Streamlit writes runtime config/credentials under its home dir.
        - name: streamlit-home
          emptyDir: {}
