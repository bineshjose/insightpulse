# Prometheus Operator scrape configuration for the InsightPulse API.
#
# Requires the Prometheus Operator CRDs (installed by kube-prometheus-stack;
# see infra/monitoring/README.md). The `release` label must match the Helm
# release name of the kube-prometheus-stack install — that is the label its
# Prometheus instance uses to discover ServiceMonitors.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: insightpulse-app
  namespace: insightpulse
  labels:
    app.kubernetes.io/name: insightpulse-app
    app.kubernetes.io/part-of: insightpulse
    # Must match the kube-prometheus-stack release name (serviceMonitorSelector).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: insightpulse-app
  namespaceSelector:
    matchNames:
      - insightpulse
  endpoints:
    - port: http            # named port on the insightpulse-app Service
      path: /metrics
      interval: 30s         # matches the dashboard's 30s refresh cadence
      scrapeTimeout: 10s
      honorLabels: false
      # Keep pod-identity labels so per-replica series survive rollouts.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
          action: replace
