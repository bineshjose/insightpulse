# =============================================================================
# TEMPLATE ONLY — never commit real values.
# =============================================================================
# In the AKS deployment this Secret is *not* applied by hand: the Key Vault
# CSI driver (keyvault-csi.yaml) creates and syncs `insightpulse-secrets`
# from Azure Key Vault automatically. This template exists for two reasons:
#   1. Documentation of the exact keys the deployments expect.
#   2. Local/kind clusters without Azure, where you populate it yourself:
#        kubectl create secret generic insightpulse-secrets \
#          --namespace insightpulse \
#          --from-literal=ANTHROPIC_API_KEY=sk-... \
#          --from-literal=DATABASE_URL=postgresql+asyncpg://... \
#          --from-literal=REDIS_URL=rediss://...
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: insightpulse-secrets
  namespace: insightpulse
  labels:
    app.kubernetes.io/part-of: insightpulse
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"   # LLM provider key (Claude models)
  OPENAI_API_KEY: "REPLACE_ME"      # LLM provider key (GPT models)
  DATABASE_URL: "REPLACE_ME"        # postgresql+asyncpg://user:pass@host:5432/db
  REDIS_URL: "REPLACE_ME"           # rediss://:key@host:6380/0
