[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insightpulse"
version = "1.0.0"
description = "Agentic AI Digital Twins for Synthetic Panelist Pulse Surveys"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Binesh Jose", email = "ch24m521@smail.iitm.ac.in" },
]
keywords = [
    "digital-twins",
    "synthetic-surveys",
    "multi-agent",
    "consumer-research",
    "LLM",
    "calibration",
]

dependencies = [
    # --- Core Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # --- Agent Orchestration ---
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # --- LLM Routing ---
    "litellm>=1.50.0",

    # --- ML & Embeddings ---
    "torch>=2.4.0",
    "scikit-learn>=1.5.0",
    "faiss-cpu>=1.8.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    # pandas 3.x + pyarrow 20+ segfault under Streamlit script reruns
    # (Arrow compute/convert calls from script-runner threads); hold both back.
    "pandas>=2.2.0,<3.0",
    "pyarrow>=15.0.0,<20",

    # --- Calibration (Optimal Transport) ---
    "pot>=0.9.4",

    # --- Dashboard ---
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "altair>=5.4.0",

    # --- Experiments / Figures ---
    "matplotlib>=3.8.0",

    # --- Data & Storage ---
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # --- Observability ---
    "structlog>=24.4.0",

    # --- Utilities ---
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

prod = [
    "psycopg2-binary>=2.9.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "gunicorn>=23.0.0",
    "prometheus-client>=0.21.0",
]

etl = [
    "snowflake-connector-python>=3.6.0",
    "azure-storage-file-datalake>=12.14.0",
    "azure-identity>=1.15.0",
    "asyncpg>=0.29.0",
]

[project.scripts]
insightpulse = "insightpulse.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/insightpulse"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Math symbols used intentionally in chart labels and stats docstrings.
allowed-confusables = ["σ", "ρ", "ε", "×", "−", "ℝ"]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe intent; docstrings on every test add noise.
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/insightpulse --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
